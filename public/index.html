<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sulthan MD — Nexus IoT Energy Platform</title>
    <meta
      name="description"
      content="Nexus — an end-to-end IoT energy monitoring platform: Janitza power analysers, Teltonika industrial routers, WireGuard, Hetzner Cloud, TimescaleDB and Grafana. Built and operated by Sulthan MD, Senior Data Engineer."
    />
    <meta name="theme-color" content="#070a0f" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sulthan MD — Nexus IoT Energy Platform" />
    <meta
      property="og:description"
      content="From the meter in the cabinet to the dashboard: Janitza UMG801, Teltonika RUTC50/RUT901, WireGuard, Hetzner Cloud, TimescaleDB, Grafana."
    />

    <!-- Set the theme before first paint so the page never flashes the wrong one. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nexus-portfolio-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /* Colours resolve to CSS variables defined in src/index.css, which is
         where light and dark are actually set. The `<alpha-value>` form keeps
         opacity modifiers (bg-signal/10, border-line/60) working. */
      const v = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              base: v('base'),
              sunken: v('sunken'),
              surface: v('surface'),
              raised: v('raised'),
              line: v('line'),
              ink: v('ink'),
              muted: v('muted'),
              faint: v('faint'),
              onSignal: v('on-signal'),
              signal: {
                DEFAULT: v('signal'),
                dim: v('signal-dim'),
              },
              data: {
                DEFAULT: v('data'),
                dim: v('data-dim'),
              },
              warn: v('warn'),
              grid: v('grid'),
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
